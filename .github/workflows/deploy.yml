name: Deploy Wiki to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Zensical
        run: |
          python -m pip install --upgrade pip
          pip install zensical

      - name: Security & Leaked Tooling Audit
        run: |
          python -c "
          import sys, pathlib
          forbidden = ['/cb testing', 'Plugwright', 'DevStudio', 'VirtualChestGui', 'MockPlayer']
          docs = pathlib.Path('docs')
          errors = []
          for f in docs.rglob('*.md'):
              text = f.read_text(encoding='utf-8')
              for term in forbidden:
                  if term in text:
                      errors.append(f'{f}: contains forbidden term \"{term}\"')
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          "

      - name: Build site with Zensical
        run: |
          python -m zensical build --clean --strict

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
