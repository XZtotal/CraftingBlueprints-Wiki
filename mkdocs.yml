site_name: CraftingBlueprints Wiki
site_description: "Official Documentation, Configuration Guides, and Administration Manual for CraftingBlueprints."
site_author: "XZtotal"
site_url: "https://xztotal.github.io/CraftingBlueprints-Wiki/"
repo_url: "https://github.com/XZtotal/CraftingBlueprints-Wiki"
repo_name: "XZtotal/CraftingBlueprints-Wiki"

theme:
  name: material
  language: en
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list
  - md_in_html
  - def_list

nav:
  - Home: index.md
  - Getting Started:
      - Installation & Requirements: getting-started/installation.md
      - Quickstart (First Blueprint): getting-started/quickstart.md
  - General Configuration:
      - Configuration Guide (config.yml): configuration/config-guide.md
      - Messages, Colors & MiniMessage: configuration/messages-and-colors.md
  - Blueprint Authoring:
      - YAML Structure & Fields: blueprints/basic-blueprint-yaml.md
      - Durability, Limits & Uses: blueprints/durability-and-uses.md
      - Reusable Templates (Mixins): blueprints/templates-guide.md
      - Blueprint Packs & Groups: blueprints/groups-and-packs.md
      - Map Schematics & Visuals: blueprints/map-visuals.md
      - Custom Items & CustomModelData: blueprints/custom-items.md
  - In-Game Gameplay:
      - Player Journey & Crafting: mechanics/player-experience.md
      - Recipe Restrictions (Whitelist Mode): mechanics/recipe-restrictions.md
      - Crafter Automation (1.21+): mechanics/crafter-support.md
      - Potions & Smithing Upgrades: mechanics/potions-and-smithing.md
  - In-Game Menus (GUIs):
      - Player Progression Menu (/cb menu): gui/player-menu.md
      - Blueprint Catalog (/cb item list): gui/catalog-menu.md
      - In-Game Editor (/cb item edit): gui/in-game-editor.md
  - Commands & Permissions:
      - Command Reference: commands-permissions/commands-reference.md
      - LuckPerms & Permissions Guide: commands-permissions/luckperms-guide.md
  - Database & Networks:
      - Standalone Setup (SQLite): storage/sqlite-setup.md
      - Multi-Server Network (MySQL): storage/mysql-multiserver.md
  - Presets & Scaffolder:
      - Pre-Built Presets (/cb preset): presets/using-presets.md
      - Auto-Scaffolder (/cb generate): presets/auto-scaffolder.md
  - Tutorials & Cookbook:
      - Gating Netherite Gear (SMP): tutorials/tutorial-smp-netherite.md
      - Magic 3-Use Scrolls (RPG): tutorials/tutorial-rpg-scrolls.md
      - Blueprint Economy Shop (Vault): tutorials/tutorial-vault-shop.md
      - Crates & Quest Rewards: tutorials/tutorial-crates-and-quests.md
  - FAQ & Support:
      - Frequently Asked Questions: faq/faq.md
      - Troubleshooting Common Issues: faq/troubleshooting.md
      - Reporting Bugs & Getting Help: faq/getting-support.md
